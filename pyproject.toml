[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-data-platform-lab"
version = "0.1.0"
description = "A Terraform and LocalStack data platform with reconciled incremental loads"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["boto3==1.37.20", "duckdb==1.2.2", "PyYAML==6.0.2", "dagster==1.10.9"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.13", "moto[s3]==5.1.1"]

[project.scripts]
data-platform-lab = "data_platform_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_platform_lab = ["sql/*.sql", "contracts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["data_platform_lab"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
