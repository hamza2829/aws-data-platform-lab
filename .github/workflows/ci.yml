name: AWS data platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: 'true'
  PYTHONHASHSEED: '0'

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.11.13
      - run: ruff check .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Reject em dash characters
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              assert '\u2014' not in Path(name).read_text(encoding='utf-8'), f'em dash in {name}'
          PY

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: >-
          pytest --cov --cov-report=term-missing --cov-report=json:artifacts/coverage.json
          --cov-report=html:artifacts/htmlcov --junitxml=artifacts/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/

  localstack-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      localstack:
        image: localstack/localstack:4.3.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3,iam,sts
          EAGER_SERVICE_LOADING: '1'
          AWS_DEFAULT_REGION: us-east-1
        options: >-
          --health-cmd "curl -fs http://localhost:4566/_localstack/health"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - run: pip install -e .
      - run: mkdir -p artifacts
      - run: terraform -chdir=infra init -input=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra apply -auto-approve -input=false
      - run: terraform -chdir=infra plan -detailed-exitcode -input=false
      - run: terraform -chdir=infra output -json > artifacts/terraform-outputs.json
      - run: cp infra/.terraform.lock.hcl artifacts/terraform.lock.hcl
      - run: python scripts/verify_infra.py
      - run: python scripts/integration.py
      - run: python -m pip freeze > artifacts/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-results
          path: artifacts/
      - name: Destroy emulator resources
        if: always()
        run: terraform -chdir=infra destroy -auto-approve -input=false

  publish-results:
    needs: [lint, tests, localstack-apply]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-results'
          merge-multiple: true
          path: artifacts
      - run: python scripts/publish_results.py
      - name: Commit measured results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md reports infra/.terraform.lock.hcl
          if ! git diff --cached --quiet; then
            git commit -m 'Update measured CI results'
            git push
          fi
